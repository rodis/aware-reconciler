# The tier's credentials, synced by the Doppler operator from the SAME config the CronWorkflows
# in `inference` read (kafka-aiven-credentials/reconciler) — a second derived copy, not a
# second authored one. That config's isolation (root of its own environment, inherits nothing)
# is unchanged by this.
#
# Named `aware-reconciler-credentials`, not `reconciler-credentials`: both DopplerSecrets live
# in doppler-operator-system, and the same name would have two Argo CD apps fighting over one
# object until `inference`'s copy is removed.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: aware-reconciler-credentials
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret
    namespace: doppler-operator-system
  project: kafka-aiven-credentials
  config: reconciler
  managedSecret:
    name: reconciler-credentials
    namespace: aware-reconciler
    type: Opaque
