# Newsletters nobody needs past the day they arrive (owner, 2026-11-03). Writes ON since
# 2026-11-03: the dry-run preview (would trash 71, refused 0) matched a direct Gmail search
# before this was switched. Trashed mail stays in Gmail's Bin for 30 days.
apiVersion: aware.rods.me/v1
kind: SenderPurge
metadata:
  name: newsletters
  namespace: aware-reconciler
  annotations:
    # The CRD and this object can arrive in the same sync; see tasksweep-aware-todo.yml.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  senders:
    - mftradingguide@class.it
    # Added 2026-11-03. Preview, inbox only, before the cutoff: LinkedIn 200+ (back to
    # 2026-06-29), newslettermf 51, noreply@class.it 0. At maxPerRun 100 LinkedIn's backlog
    # drains in 2-3 passes.
    - jobalerts-noreply@linkedin.com
    - newslettermf@class.it
    - noreply@class.it
  timezone: Europe/Zurich
  minAgeHours: 12
  maxPerRun: 100
  dryRun: false
