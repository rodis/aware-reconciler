# The monthly DreamHost invoice. Writes ON since 2026-11-03, after Argo's `advance-cycles` was
# suspended and Prefect paused — this is the only thing that opens or advances it. The first pass
# opened dh_invoice_2026_011 (October 2026's work) fresh at 98/h; the dry run previewed 22 days,
# USD 17,248.00.
apiVersion: aware.rods.me/v1
kind: Process
metadata:
  name: dreamhost-invoice
  namespace: aware-reconciler
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  definition: dreamhost_invoice
  timezone: Europe/Zurich
  openScheduled: true
  dryRun: false
