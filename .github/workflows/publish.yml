# On every push to main: build the image, then write `deploy-state` — main's tree with the image
# tag pinned to the commit just built. Argo CD tracks `deploy-state`, never `main`.
#
# Deliberately simpler than `inference`'s pair of workflows. There is ONE image here, so every
# push rebuilds it and pins the result: no component discovery, no carrying tags forward, and
# no separate mirror job for deploy-only commits. A deploy-only push rebuilds an identical
# image under a new tag, which costs a minute of CI and buys one code path instead of two.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel: a cancelled run between "image pushed" and "deploy-state written" is harmless,
# but two runs racing to force-push deploy-state could leave an older tag pinned.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/aware-reconciler
  # Where the tag is pinned. Written in the next step of the work (the deploy files); until it
  # exists this workflow still builds and still mirrors main to deploy-state, and says so.
  KUSTOMIZATION: deploy/operator/kustomization.yml

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build-push:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `sha-<short>` is what gets pinned; `latest` is for humans running it by hand.
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/reconciler/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-state:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Pin the image tag
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA:0:7}"
          if [ ! -f "$KUSTOMIZATION" ]; then
            echo "::warning::$KUSTOMIZATION does not exist yet — mirroring main without pinning a tag"
            exit 0
          fi
          # `kustomize edit` would also work; yq is preinstalled on the runner and keeps the
          # file's comments.
          IMAGE="$IMAGE" TAG="$tag" yq -i \
            '(.images[] | select(.name == strenv(IMAGE))).newTag = strenv(TAG)' "$KUSTOMIZATION"
          # Fail rather than publish a deploy-state that silently kept the old tag.
          grep -q "newTag: $tag" "$KUSTOMIZATION" \
            || { echo "::error::no images entry named $IMAGE in $KUSTOMIZATION"; exit 1; }
          echo "pinned $IMAGE:$tag"

      - name: Force-push deploy-state
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- deploy/; then
            git commit -am "deploy: aware-reconciler @ sha-${GITHUB_SHA:0:7}" \
              --trailer "Code-Commit:${GITHUB_SHA}"
          fi
          git push --force origin HEAD:deploy-state
